# 术语大小写与写法统一。
# swap 左侧是错误写法，右侧是规范写法。
# 团队可按需往里加自己的专名。
extends: substitution
message: "请统一写作「%s」。"
level: error
ignorecase: false
swap:
  Javascript: JavaScript
  Typescript: TypeScript
  Github: GitHub
  Gitlab: GitLab
  NPM: npm
  NodeJS: Node.js
  nodejs: Node.js
  Postgresql: PostgreSQL
  Mongodb: MongoDB
  Vscode: VS Code
  Macos: macOS
  IOS: iOS
  Html5: HTML5
  Css3: CSS3
  K8s: Kubernetes
  k8s: Kubernetes
  零复制: 零拷贝
  Webpack: webpack
  Dockerized: Docker 化
