                    <header class="article-header">
                        <h1 class="article-title">XSS 防护：从你遇到的问题出发</h1>
                        <div class="article-meta">
                            <span class="meta-item">🏷️ XSS</span>
                            <span class="meta-item reading-time"></span>
                        </div>
                    </header>
                    <div class="article-content">
<p>这篇不讲理论，就讲你做项目时会遇到的真实问题，以及XSS怎么帮你解决。</p>

<div class="mermaid">
flowchart TB
    A[XSS] --> B[存储型]
    B --> C[反射型]
    C --> D[DOM型]
</div>

<h2>1. 网站被注入 JS 脚本</h2>

<div class="callout callout-info">
<div class="callout-title">你遇到的问题</div>
<p>用户评论里插入了 <script>，其他用户打开就执行了。</p>
</div>

<p><strong>怎么解决？</strong>XSS 跨站脚本攻击，要做输出转义。</p>

<h2>2. XSS 是什么</h2>

<div class="callout callout-info">
<div class="callout-title">你遇到的问题</div>
<p>听说 XSS 攻击，到底是什么？</p>
</div>

<p><strong>怎么解决？</strong>跨站脚本攻击，把恶意 JS 注入到网页里执行。</p>

<h2>3. 怎么防 XSS</h2>

<div class="callout callout-info">
<div class="callout-title">你遇到的问题</div>
<p>怎么防止 XSS？</p>
</div>

<p><strong>怎么解决？</strong>输出转义、CSP 头、HttpOnly Cookie。</p>

<h2>XSS 类型</h2>

<table>
<thead><tr><th>类型</th><th>说明</th></tr></thead>
<tbody>
<tr><td>存储型</td><td>恶意代码存数据库，最危险</td></tr>
<tr><td>反射型</td><td>URL 带恶意代码反射执行</td></tr>
<tr><td>DOM型</td><td>前端 JS 处理不当导致</td></tr>
</tbody></table>

<div class="callout callout-tip">
<div class="callout-title">新手最容易踩的坑</div>
<ul>
<li><strong>输出一定要转义</strong>用户输入展示到页面一定要转义。</li>
<li><strong>Cookie 设 HttpOnly</strong>防止 JS 偷 Cookie。</li>
</ul>
</div>
