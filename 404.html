<head>

    <link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@400;500;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap">
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <a href="./" class="header-brand">
                <span class="logo-mark">~$</span>
                <span class="blog-title">资深码农</span>
            </a>
            <button class="theme-toggle" title="切换主题" aria-label="切换主题" style="margin-left:auto">
                <span class="icon-moon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></span>
                <span class="icon-sun"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span>
            </button>
        </div>
    </header>

    <div id="main-area">
        <div id="content-wrapper">
            <div id="body-content">
                <div class="error-page">
                    <div class="error-terminal">
                        <div class="error-terminal-bar">
                            <span class="arch-cmd-dot" style="--dc:#ff5f56"></span>
                            <span class="arch-cmd-dot" style="--dc:#ffbd2e"></span>
                            <span class="arch-cmd-dot" style="--dc:#27c93f"></span>
                            <span class="error-terminal-title">404 — page_not_found</span>
                        </div>
                        <div class="error-terminal-body">
                            <div class="error-code">404</div>
                            <p class="error-msg">ERROR: page_not_found</p>
                            <p class="error-hint">抱歉，你访问的页面不存在，可能链接已失效或内容已迁移。</p>
                            <img class="error-gopher" src="images/gopher-404.jpg" alt="404 吉祥物">
                            <div class="error-search-box">
                                <input type="text" id="error-search-input" placeholder="搜索文章..." aria-label="搜索文章">
                                <button id="error-search-btn">搜索</button>
                            </div>
                            <div id="error-search-results-inline"></div>
                        </div>
                    </div>

                    <a class="home-link" href="./">← 返回首页</a>

                    <div class="error-popular">
                        <h3>热门文章</h3>
                        <ul>
                            <li><a href="database/mysql/">MySQL 深度解析</a></li>
                            <li><a href="database/redis/">Redis 深度解析</a></li>
                            <li><a href="programming/go/">Go 语言</a></li>
                            <li><a href="devops/nginx/">Nginx 教程</a></li>
                            <li><a href="ai/llm/agent/">大模型 Agent 开发</a></li>
                            <li><a href="ai/llm/rag-engineering/">RAG 工程从入门到精通</a></li>
                            <li><a href="frontend/cross-platform/flutter/">Flutter</a></li>
                            <li><a href="frontend/cross-platform/app-publish/">应用发布指南</a></li>
                            <li><a href="tools/vcs/">Git 教程</a></li>
                            <li><a href="programming/python/">Python 教程</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="site-footer">
        <div class="footer-links">
            <a href="feed.xml" title="RSS 订阅">
                <svg viewBox="0 0 24 24"><path d="M6.18 15.64a2.18 2.18 0 0 1 2.18 2.18C8.36 19 7.38 20 6.18 20C5 20 4 19 4 17.82a2.18 2.18 0 0 1 2.18-2.18M4 4.44A15.56 15.56 0 0 1 19.56 20h-2.83A12.73 12.73 0 0 0 4 7.27V4.44m0 5.66a9.9 9.9 0 0 1 9.9 9.9h-2.83A7.07 7.07 0 0 0 4 12.93V10.1z"/></svg>
                RSS 订阅
            </a>
            <a href="atom.xml" title="Atom 订阅">Atom</a>
            <a href="sitemap.xml" title="网站地图">Sitemap</a>
        </div>
    </footer>

    <script>
    (function () {
        'use strict';
        var searchIndex = null;

        function doErrorSearch() {
            var q = document.getElementById('error-search-input').value.trim();
            var resultsEl = document.getElementById('error-search-results-inline');
            if (!q) { resultsEl.innerHTML = ''; return; }
            if (!searchIndex) {
                fetch('search-index.json').then(function(r){return r.json();}).then(function(data){
                    searchIndex = data;
                    renderErrorSearch(q, resultsEl);
                }).catch(function(){ resultsEl.innerHTML = '<p class="search-result-item">搜索索引加载失败</p>'; });
            } else {
                renderErrorSearch(q, resultsEl);
            }
        }

        function renderErrorSearch(q, resultsEl) {
            var matches = [];
            var ql = q.toLowerCase();
            searchIndex.forEach(function(item) {
                if ((item.title && item.title.toLowerCase().indexOf(ql) >= 0) ||
                    (item.text && item.text.toLowerCase().indexOf(ql) >= 0)) {
                    matches.push(item);
                }
            });
            if (matches.length === 0) {
                resultsEl.innerHTML = '<p class="search-result-item">未找到相关文章</p>';
                return;
            }
            // 使用 DOM API 避免 XSS
            resultsEl.innerHTML = '';
            var ul = document.createElement('ul');
            ul.style.cssText = 'list-style:none;padding:0;margin:0.8rem 0 0;';
            matches.slice(0, 8).forEach(function(item) {
                var path = item.url.replace(/^\//, '');
                if (!path) { path = 'index.html'; }
                else if (path.charAt(path.length - 1) === '/') { path += 'index.html'; }
                var li = document.createElement('li');
                li.style.margin = '5px 0';
                var a = document.createElement('a');
                a.href = path;
                a.style.cssText = 'color:var(--accent);text-decoration:none;font-size:0.9rem;';
                a.textContent = item.title;
                li.appendChild(a);
                ul.appendChild(li);
            });
            resultsEl.appendChild(ul);
        }

        document.addEventListener('DOMContentLoaded', function () {
            var input = document.getElementById('error-search-input');
            var btn = document.getElementById('error-search-btn');
            if (input) {
                input.addEventListener('keydown', function (e) {
                    if (e.key === 'Enter') doErrorSearch();
                });
            }
            if (btn) {
                btn.addEventListener('click', doErrorSearch);
            }
        });
    })();
    </script>
    <script src="js/main.js?v=2" defer></script>
</body>
</html>
